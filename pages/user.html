<!-- User Management Page -->
<section class="page-section">
  <div class="page-header">
    <h2 class="page-title">Manajemen User</h2>
    <p class="page-subtitle">Kelola pengguna sistem</p>
  </div>

  <div class="page-actions">
    <button class="btn btn--primary" onclick="showAddUserModal()">
      <i data-lucide="plus"></i>
      <span>Tambah User</span>
    </button>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <label>Role</label>
      <select id="filterRole">
        <option value="">Semua Role</option>
        <option value="admin">Admin</option>
        <option value="staff_gudang">Staff Gudang</option>
        <option value="checker_opname">Checker</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Status</label>
      <select id="filterStatus">
        <option value="">Semua Status</option>
        <option value="active">Aktif</option>
        <option value="inactive">Nonaktif</option>
      </select>
    </div>
  </div>

  <div class="card">
    <table class="data-table" id="usersTable">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="6" class="text-center text-muted">Memuat data...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<div id="userModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal__header">
      <h3 class="modal__title" id="userModalTitle">Tambah User</h3>
      <button class="modal__close" onclick="closeUserModal()" aria-label="Tutup">
        <i data-lucide="x"></i>
      </button>
    </div>
    <form id="userForm" onsubmit="saveUser(event)">
      <div class="form-group">
        <label for="userUsername">Username</label>
        <input type="text" id="userUsername" class="form-input" required minlength="3">
      </div>
      <div class="form-group">
        <label for="userEmail">Email</label>
        <input type="email" id="userEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="userNama">Nama Lengkap</label>
        <input type="text" id="userNama" class="form-input" required minlength="2" maxlength="200">
      </div>
      <div class="form-group">
        <label for="userRole">Role</label>
        <select id="userRole" class="form-input" required>
          <option value="">-- Pilih Role --</option>
          <option value="staff_gudang">Staff Gudang</option>
          <option value="checker_opname">Checker</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label for="userPassword">Password <span id="passwordHint">(minimal 8 karakter)</span></label>
        <input type="password" id="userPassword" class="form-input" minlength="8">
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="userActive" checked>
          <span>User Aktif</span>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--secondary" onclick="closeUserModal()">Batal</button>
        <button type="submit" class="btn btn--primary" id="saveUserBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<style>
  .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .checkbox-label input { width: 18px; height: 18px; }
  #passwordHint { font-size: 11px; color: #94A3B8; font-weight: normal; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn--loading { position: relative; color: transparent !important; }
  .btn--loading::after { content: ""; position: absolute; width: 16px; height: 16px; top: 50%; left: 50%; margin-left: -8px; margin-top: -8px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
(function() {
  window.UserState = window.UserState || { userList: [], editingUserId: null, isLoading: false, requestId: 0 };

  function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function getAuthHeaders() {
    var authUser = localStorage.getItem('auth_user');
    if (!authUser) return {};
    try {
      var user = JSON.parse(authUser);
      return { 'Authorization': 'Bearer ' + (user.access_token || '') };
    } catch (e) {
      return {};
    }
  }

  async function loadUsers() {
    if (window.UserState.isLoading) return;
    window.UserState.isLoading = true;
    var tbody = document.getElementById('usersTableBody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Memuat data...</td></tr>';
    
    try {
      var role = document.getElementById('filterRole')?.value || '';
      var isActive = document.getElementById('filterStatus')?.value || '';
      var url = '/api/v1/users?';
      if (role) url += 'role=' + encodeURIComponent(role) + '&';
      if (isActive) url += 'is_active=' + encodeURIComponent(isActive);
      
      var currentRequestId = ++window.UserState.requestId;
      var response = await fetch(url, { headers: getAuthHeaders() });
      if (currentRequestId !== window.UserState.requestId) return;
      
      if (!response.ok) {
        if (response.status === 401) { showToast('Sesi berakhir. Silakan login ulang.', false); return; }
        throw new Error('Failed to load');
      }
      
      var payload = await response.json();
      window.UserState.userList = payload.data || [];
      renderUsersTable();
    } catch (error) {
      console.error('Error loading users:', error);
      if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Gagal memuat data</td></tr>';
    } finally {
      window.UserState.isLoading = false;
    }
  }

  function renderUsersTable() {
    var tbody = document.getElementById('usersTableBody');
    if (!tbody) return;
    var users = window.UserState.userList;
    if (users.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Tidak ada user ditemukan</td></tr>'; return; }
    
    tbody.innerHTML = users.map(function(user) {
      var roleClass = user.role === 'admin' ? 'role-admin' : user.role === 'staff_gudang' ? 'role-staff_gudang' : 'role-checker_opname';
      var isActive = user.status === 'active' || user.is_active;
      return '<tr><td>' + escapeHtml(user.nama || user.name || '-') + '</td><td><code>' + escapeHtml(user.username) + '</code></td><td>' + escapeHtml(user.email || '-') + '</td><td><span class="role-badge ' + roleClass + '">' + formatRole(user.role) + '</span></td><td><span class="status-badge ' + (isActive ? 'status-active' : 'status-inactive') + '">' + (isActive ? 'Aktif' : 'Nonaktif') + '</span></td><td><button class="action-btn" onclick="UserMgmt.showEdit(\'' + user.id + '\')" title="Edit"><i data-lucide="edit-2"></i></button><button class="action-btn" onclick="UserMgmt.toggleStatus(\'' + user.id + '\', ' + !isActive + ')" title="' + (isActive ? 'Nonaktifkan' : 'Aktifkan') + '"><i data-lucide="' + (isActive ? 'user-minus' : 'user-plus') + '"></i></button><button class="action-btn" onclick="UserMgmt.resetPassword(\'' + user.id + '\')" title="Reset Password"><i data-lucide="key"></i></button><button class="action-btn danger" onclick="UserMgmt.deleteUser(\'' + user.id + '\')" title="Hapus"><i data-lucide="trash-2"></i></button></td></tr>';
    }).join('');
    if (window.lucide) lucide.createIcons({ nodes: [tbody] });
  }

  function formatRole(role) {
    var roles = { 'admin': 'Admin', 'staff_gudang': 'Staff Gudang', 'checker_opname': 'Checker' };
    return roles[role] || escapeHtml(role) || '-';
  }

  window.UserMgmt = {
    showAdd: function() {
      window.UserState.editingUserId = null;
      document.getElementById('userModalTitle').textContent = 'Tambah User';
      document.getElementById('userUsername').value = '';
      document.getElementById('userUsername').disabled = false;
      document.getElementById('userEmail').value = '';
      document.getElementById('userNama').value = '';
      document.getElementById('userRole').value = 'staff_gudang';
      document.getElementById('userPassword').value = '';
      document.getElementById('userPassword').required = true;
      document.getElementById('userActive').checked = true;
      document.getElementById('passwordHint').style.display = 'inline';
      document.getElementById('passwordHint').textContent = '(minimal 8 karakter)';
      document.getElementById('userModal').classList.add('active');
      setTimeout(function() { document.getElementById('userUsername').focus(); }, 100);
    },
    showEdit: async function(id) {
      try {
        var response = await fetch('/api/v1/users/' + id, { headers: getAuthHeaders() });
        if (!response.ok) { if (response.status === 401) { showToast('Sesi berakhir.', false); return; } throw new Error(); }
        var user = (await response.json()).data;
        window.UserState.editingUserId = id;
        document.getElementById('userModalTitle').textContent = 'Edit User';
        document.getElementById('userUsername').value = escapeHtml(user.username || '');
        document.getElementById('userUsername').disabled = true;
        document.getElementById('userEmail').value = escapeHtml(user.email || '');
        document.getElementById('userNama').value = escapeHtml(user.name || user.nama_lengkap || '');
        document.getElementById('userRole').value = user.role || 'staff_gudang';
        document.getElementById('userPassword').value = '';
        document.getElementById('userPassword').required = false;
        document.getElementById('userActive').checked = user.is_active === true || user.status === 'active';
        document.getElementById('passwordHint').textContent = '(kosongkan jika tidak diubah)';
        document.getElementById('userModal').classList.add('active');
      } catch (e) { showToast('Gagal memuat data', false); }
    },
    closeModal: function() { document.getElementById('userModal').classList.remove('active'); document.getElementById('userForm').reset(); window.UserState.editingUserId = null; },
    saveUser: async function(e) {
      e.preventDefault();
      var btn = document.getElementById('saveUserBtn'), orig = btn.textContent;
      var pwd = document.getElementById('userPassword').value;
      var isEdit = window.UserState.editingUserId !== null;
      if (!isEdit && pwd.length < 8) { showToast('Password minimal 8 karakter!', false); return; }
      if (isEdit && pwd && pwd.length < 8) { showToast('Password minimal 8 karakter!', false); return; }
      var data = { username: document.getElementById('userUsername').value.trim(), email: document.getElementById('userEmail').value.trim(), nama: document.getElementById('userNama').value.trim(), role: document.getElementById('userRole').value, status: document.getElementById('userActive').checked ? 'active' : 'inactive' };
      if (pwd) data.password = pwd;
      btn.disabled = true; btn.classList.add('btn--loading'); btn.textContent = '';
      try {
        var resp = await fetch(isEdit ? '/api/v1/users/' + window.UserState.editingUserId : '/api/v1/users', { method: isEdit ? 'PUT' : 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeaders()), body: JSON.stringify(data) });
        if (!resp.ok) throw new Error((await resp.json().catch(function(){return{}})).message || 'Gagal');
        showToast(isEdit ? 'User berhasil diupdate' : 'User berhasil ditambahkan');
        window.UserMgmt.closeModal(); loadUsers();
      } catch (err) { showToast(err.message || 'Gagal menyimpan', false); }
      finally { btn.disabled = false; btn.classList.remove('btn--loading'); btn.textContent = orig; }
    },
    deleteUser: async function(id) { if (!confirm('Yakin hapus user?')) return; try { var r = await fetch('/api/v1/users/' + id, {method:'DELETE', headers: getAuthHeaders()}); if (!r.ok) throw new Error((await r.json().catch(function(){return{}})).message); showToast('User dihapus'); loadUsers(); } catch(e) { showToast(e.message || 'Gagal', false); } },
    toggleStatus: async function(id, enable) { var a = enable ? 'mengaktifkan' : 'menonaktifkan'; if (!confirm('Yakin ' + a + ' user?')) return; try { var r = await fetch('/api/v1/users/' + id + '/' + (enable ? 'enable' : 'disable'), {method:'POST', headers: getAuthHeaders()}); if (!r.ok) throw new Error((await r.json().catch(function(){return{}})).message); showToast(enable ? 'Diaktifkan' : 'Dinonaktifkan'); loadUsers(); } catch(e) { showToast(e.message || 'Gagal', false); } },
    resetPassword: async function(id) { if (!confirm('Reset password?')) return; try { var r = await fetch('/api/v1/users/' + id + '/reset-password', {method:'POST', headers: getAuthHeaders()}); if (!r.ok) throw new Error((await r.json().catch(function(){return{}})).message); showToast('Password direset'); loadUsers(); } catch(e) { showToast(e.message || 'Gagal', false); } }
  };

  window.showAddUserModal = window.UserMgmt.showAdd;
  window.editUser = window.UserMgmt.showEdit;
  window.closeUserModal = window.UserMgmt.closeModal;
  window.saveUser = window.UserMgmt.saveUser;
  window.deleteUser = window.UserMgmt.deleteUser;
  window.toggleUserStatus = window.UserMgmt.toggleStatus;
  window.resetUserPassword = window.UserMgmt.resetPassword;
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') window.UserMgmt.closeModal(); });
  document.getElementById('filterRole')?.addEventListener('change', loadUsers);
  document.getElementById('filterStatus')?.addEventListener('change', loadUsers);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadUsers); else loadUsers();
})();
</script>
